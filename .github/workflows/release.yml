# Builds github.ari and attaches it to the release.
name: Release
# Manual for now: the build needs ARI's plugin host support, which is not on GitHub yet. Switch this back to
#   on: { push: { tags: ["v*"] } }
# once it is, and the workflow will build a release from every version tag.
on:
  workflow_dispatch:
jobs:
  release:
    uses: ari-labz/A.R.I-Plugins/.github/workflows/release-plugin.yml@main
    permissions: { contents: write }
    with:
      id: github
      name: GitHub
      description: "Gives Ari your GitHub account for issues, pull requests, releases and Actions, through GitHub's own CLI."
      author: first-party
      project: ARI.Plugin.GitHub.csproj
      entry: ARI.Plugin.GitHub.dll
